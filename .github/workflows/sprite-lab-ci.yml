name: Sprite Lab CI

# GitHub-hosted runners are an optional mirror. The recovered feature is
# verified through the authorized Home Center -> Phone Hands -> primary-phone
# lane so a hosted-runner provisioning failure cannot masquerade as a code test.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure Pillow is available for GIF validation
        run: python3 -c "from PIL import Image; print(Image.__version__)" || python3 -m pip install --user --disable-pip-version-check pillow==11.3.0
      - run: npm run test:sprite-slicer
      - run: npm run test:gif-encoder
      - run: npm run test:2d
      - run: npm run build
      - run: npm run smoke
      - run: git diff --check
