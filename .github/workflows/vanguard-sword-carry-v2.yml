name: Vanguard Sword Carry V2
on:
  push:
    branches:
      - agent/vanguard-sword-carry-v2
    paths:
      - tools/author_vanguard_walk_sword_carry_v2_blender.py
      - tools/finalize_vanguard_walk_sword_carry_v2.py
      - .github/workflows/vanguard-sword-carry-v2.yml

permissions:
  contents: write

env:
  BLENDER_VERSION: "4.4.0"
  CANDIDATE_PATH: public/assets/vanguard/steel/candidates/walk-sword-carry-v2/attempt-001

jobs:
  author-review-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .toolcache/blender-4.4.0
          key: blender-linux-x64-4.4.0-official-sha256-v2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pose-packet-pip-pillow-11.3.0
      - name: Author direct final-rig candidate
        env:
          BLENDER_BIN: .toolcache/blender-4.4.0/blender
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          python3 -c 'from PIL import Image' || python3 -m pip install --user pillow==11.3.0
          node scripts/run-blender-tool.mjs tools/author_vanguard_walk_sword_carry_v2_blender.py -- \
            --asset public/assets/vanguard/vanguard_rigged_animations.glb \
            --out-dir generated/vanguard/walk-sword-carry-v2
          python3 tools/finalize_vanguard_walk_sword_carry_v2.py \
            --root generated/vanguard/walk-sword-carry-v2 \
            --publish "$CANDIDATE_PATH"
      - name: Verify protected assets and candidate packet
        run: |
          git diff --exit-code HEAD -- \
            public/assets/vanguard/fleshpunk/walk \
            public/assets/vanguard/fleshpunk/candidates/walk/attempt-001
          python3 -m py_compile \
            tools/author_vanguard_walk_sword_carry_v2_blender.py \
            tools/finalize_vanguard_walk_sword_carry_v2.py
          test -f "$CANDIDATE_PATH/animations.json"
          test -f "$CANDIDATE_PATH/contact-sheet.png"
          test -f "$CANDIDATE_PATH/orthogonal-contact-sheet.png"
          test "$(find "$CANDIDATE_PATH/frames" -type f -name '*.png' | wc -l)" -eq 8
          npm run test:2d
          npm run build
          npm run smoke
          git diff --check
      - name: Upload quarantined evidence
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-walk-sword-carry-v2-attempt-001
          path: |
            generated/vanguard/walk-sword-carry-v2/
            ${{ env.CANDIDATE_PATH }}/
          if-no-files-found: error
          retention-days: 30
      - name: Commit quarantined candidate
        run: |
          git config user.name "pose-lab-actions"
          git config user.email "actions@users.noreply.github.com"
          git add "$CANDIDATE_PATH"
          git commit -m "Add quarantined Vanguard sword carry v2 candidate"
          git push origin HEAD
