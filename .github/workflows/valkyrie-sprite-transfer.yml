name: Valkyrie Sprite Factory Transfer

on:
  push:
    branches:
      - transfer/valkyrie-sprite-factory-20260922
    paths:
      - public/assets/valkyrie-squad/factory-v1/**
      - authoring/valkyrie-squad/factory-v1/**
      - src/valkyrie-sprite-lab.js
      - tools/test_valkyrie_sprite_transfer.mjs
      - tools/capture_valkyrie_sprite_review.mjs
      - index.html
      - .github/workflows/valkyrie-sprite-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package without browser download
        run: npm install --no-save playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Verify all transferred animation IDs and assets
        run: node tools/test_valkyrie_sprite_transfer.mjs
      - name: Build Pose Lab V2
        run: npm run build
      - name: Smoke Pose Lab V2
        run: npm run smoke
      - name: Capture full-sprite Vanguard regression evidence
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/valkyrie-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node -e '
            const http=require("http");let attempts=0;
            const check=()=>http.get("http://127.0.0.1:4174/",r=>{r.resume();if(r.statusCode===200)process.exit(0);if(++attempts>50)process.exit(1);setTimeout(check,100)}).on("error",()=>{if(++attempts>50)process.exit(1);setTimeout(check,100)});
            check();
          '
          node tools/capture_valkyrie_sprite_review.mjs http://127.0.0.1:4174/ generated/valkyrie-sprite-review
      - uses: actions/upload-artifact@v4
        with:
          name: valkyrie-full-sprite-evidence-${{ github.run_id }}
          path: generated/valkyrie-sprite-review/
          if-no-files-found: error
          retention-days: 30
