name: Crimson PR Visual Evidence

on:
  push:
    branches: [agent/crimson-foot-red-gate]

permissions:
  contents: read

jobs:
  blender-frame-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender render runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil
      - name: Render Vanguard and Crimson frame zero in Blender
        id: blender
        continue-on-error: true
        run: |
          blender --background --python-exit-code 1 \
            --python tools/render_crimson_vanguard_attack1_compare_blender.py -- \
            --out-dir generated/crimson-frame-zero/${GITHUB_RUN_ID} \
            --frames start \
            --candidate-js src/review-candidates/crimson-combat-ready-vanguard-frame0-1.js \
            --candidate-id crimson-combat-ready-vanguard-frame0-1 \
            --author-frame-zero \
            --samples 16 \
            --width 1600 \
            --height 900
      - name: Stitch frame-zero comparison
        if: always()
        run: |
          python3 tools/stitch_crimson_vanguard_attack1_compare.py \
            --manifest generated/crimson-frame-zero/${GITHUB_RUN_ID}/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crimson-frame-zero-blender-${{ github.run_id }}
          path: generated/crimson-frame-zero/${{ github.run_id }}
          if-no-files-found: error
      - name: Preserve Blender rejection as a red job
        if: steps.blender.outcome == 'failure'
        run: exit 1

  capture-frame-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package without browser download
        run: npm install --no-save playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Build the review application
        run: npm run build
      - name: Capture Crimson combat-ready frame zero
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome
        run: |
          set -eu
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/crimson-v4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          URL_LIST="$(node --input-type=module - <<'NODE'
          const base = 'http://127.0.0.1:4173/index.html';
          const frames = [['start', 0]];
          const capture = (primeKey, time, cameraView = null) => {
            const params = new URLSearchParams({
              model: 'crimson',
              pose: 'attack1',
              candidate: 'crimson-combat-ready-vanguard-frame0-1',
              attackTime: String(time),
              quality: 'source',
              cacheBust: process.env.GITHUB_SHA,
            });
            const viewSuffix = cameraView ? ` ${cameraView}` : '';
            return { label: `frame-zero ${primeKey}${viewSuffix}`, primeKey, time, cameraView, url: `${base}?${params}` };
          };
          const urls = frames.map(([primeKey, time]) => capture(primeKey, time));
          for (const [primeKey, time] of [['start', 0]]) {
            urls.push(capture(primeKey, time, 'left'), capture(primeKey, time, 'right'));
          }
          process.stdout.write(JSON.stringify(urls));
          NODE
          )"
          node tools/github_crimson_visual_capture.mjs \
            --url-list "$URL_LIST" \
            --out-dir "generated/crimson-frame-zero-browser/${GITHUB_RUN_ID}" \
            --target crimson-combat-ready-frame-zero \
            --job-id "github_actions_${GITHUB_RUN_ID}" \
            --session-id "browser_session_${GITHUB_RUN_ID}" \
            --episode-id "browser_episode_${GITHUB_RUN_ID}" \
            --timeout-ms 45000 \
            --settle-ms 1500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crimson-frame-zero-browser-${{ github.run_id }}
          path: generated/crimson-frame-zero-browser/${{ github.run_id }}
          if-no-files-found: error
