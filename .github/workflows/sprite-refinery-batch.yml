name: Sprite Refinery Batch

on:
  push:
    branches:
      - agent/sprite-refinery-mvp
    paths:
      - '.github/workflows/sprite-refinery-batch.yml'
      - 'authoring/sprite-refinery/**'
      - 'tools/sprite_refinery_*'
      - 'tools/test_sprite_refinery.mjs'
      - 'src/sprite-viewer.js'
      - 'src/styles.css'
      - 'package.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: Batch manifest path or batch id
        required: false
        default: vanguard-fleshpunk-001
        type: string
      provider:
        description: Provider to use
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - openai
      publish:
        description: Publish ready clips into canonical Pose Lab assets
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pull-requests: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: sprite-refinery-${{ github.ref }}
  cancel-in-progress: false

env:
  SPRITE_REFINERY_MANIFEST: ${{ github.event.inputs.manifest || 'vanguard-fleshpunk-001' }}
  SPRITE_REFINERY_PROVIDER: ${{ github.event.inputs.provider || 'fixture' }}
  SPRITE_REFINERY_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
  BLENDER_BIN: .toolcache/blender-4.4.0/blender
  LIBGL_ALWAYS_SOFTWARE: '1'

jobs:
  planner:
    runs-on: ubuntu-latest
    outputs:
      batch_id: ${{ steps.plan.outputs.batch_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: |
          set -euo pipefail
          node tools/sprite_refinery_plan.mjs \
            --manifest "$SPRITE_REFINERY_MANIFEST" \
            --provider "$SPRITE_REFINERY_PROVIDER" \
            --out generated/sprite-refinery/plan.json
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('generated/sprite-refinery/plan.json', 'utf8'));
          console.log(`batch_id=${plan.batch_id}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-refinery-plan
          path: generated/sprite-refinery/plan.json
          if-no-files-found: error

  idle-worker:
    needs: planner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python image dependency
        run: python3 -c "from PIL import Image; print(Image.__version__)" || python3 -m pip install --user --disable-pip-version-check pillow==11.3.0
      - name: Render/edit/split/verify Idle
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPRITE_REFINERY_SKIP_RENDER: ${{ env.SPRITE_REFINERY_PROVIDER == 'fixture' && '1' || '0' }}
        run: |
          node tools/sprite_refinery_worker.mjs \
            --manifest "$SPRITE_REFINERY_MANIFEST" \
            --clip idle \
            --provider "$SPRITE_REFINERY_PROVIDER" \
            --out-dir "generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/idle"
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-refinery-worker-idle
          path: generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/idle
          if-no-files-found: error
          retention-days: 30

  swordattack1-worker:
    needs: planner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python image dependency
        run: python3 -c "from PIL import Image; print(Image.__version__)" || python3 -m pip install --user --disable-pip-version-check pillow==11.3.0
      - name: Render/edit/split/verify SwordAttack1
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPRITE_REFINERY_SKIP_RENDER: ${{ env.SPRITE_REFINERY_PROVIDER == 'fixture' && '1' || '0' }}
        run: |
          node tools/sprite_refinery_worker.mjs \
            --manifest "$SPRITE_REFINERY_MANIFEST" \
            --clip swordattack1 \
            --provider "$SPRITE_REFINERY_PROVIDER" \
            --out-dir "generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/swordattack1"
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-refinery-worker-swordattack1
          path: generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/swordattack1
          if-no-files-found: error
          retention-days: 30

  collector:
    needs: [planner, idle-worker, swordattack1-worker]
    if: ${{ always() && needs.planner.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: sprite-refinery-worker-*
          path: generated/sprite-refinery/downloaded
      - name: Normalize downloaded worker artifacts
        run: |
          mkdir -p "generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}"
          find generated/sprite-refinery/downloaded -name result.json -print | while read -r result; do
            clip=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.clip_id || 'unknown')" "$result")
            mkdir -p "generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/$clip"
            cp -R "$(dirname "$result")"/. "generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/$clip/"
          done
      - name: Collect ready clips and build review surface
        run: |
          node tools/sprite_refinery_collect.mjs \
            --manifest "$SPRITE_REFINERY_MANIFEST" \
            --publish "$SPRITE_REFINERY_PUBLISH"
          npm run test:2d
          npm run build
          npm run smoke
          git diff --check
      - name: Open or update draft batch PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Sprite Refinery batch ${{ needs.planner.outputs.batch_id }}"
          body="Automated Sprite Refinery collector output for ${{ needs.planner.outputs.batch_id }}. Review URL path: /?view=2d&manifest=./reviews/sprite-refinery/${{ needs.planner.outputs.batch_id }}/animations.json . Do not merge until generated artwork is inspected."
          existing=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            gh pr ready "$existing" --undo || true
          else
            gh pr create --draft --base main --head "${GITHUB_REF_NAME}" --title "$title" --body "$body"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-refinery-batch-review-${{ needs.planner.outputs.batch_id }}
          path: |
            public/reviews/sprite-refinery/${{ needs.planner.outputs.batch_id }}/
            generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-review:
    needs: collector
    if: ${{ always() && needs.collector.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
