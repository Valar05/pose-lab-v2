name: Sprite Refinery Batch

on:
  push:
    branches:
      - agent/sprite-refinery-mvp
    paths:
      - .github/workflows/sprite-refinery-batch.yml
      - authoring/sprite-refinery/**
      - tools/sprite_refinery_*
      - tools/test_sprite_refinery.mjs
      - src/sprite-viewer.js
      - src/styles.css
      - package.json
  workflow_dispatch:
    inputs:
      manifest:
        description: Batch manifest path or batch id
        required: false
        default: vanguard-fleshpunk-001
        type: string
      provider:
        description: Provider to use: fixture or openai
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - openai
      publish:
        description: Publish ready clips into canonical Pose Lab assets
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pull-requests: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: sprite-refinery-${{ github.ref }}
  cancel-in-progress: false

env:
  BLENDER_VERSION: "4.4.0"
  BLENDER_ARCHIVE: "blender-4.4.0-linux-x64.tar.xz"
  BLENDER_URL: "https://download.blender.org/release/Blender4.4/blender-4.4.0-linux-x64.tar.xz"
  BLENDER_CHECKSUM_URL: "https://download.blender.org/release/Blender4.4/blender-4.4.0.sha256"

jobs:
  planner:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_concurrency: ${{ steps.plan.outputs.max_concurrency }}
      batch_id: ${{ steps.plan.outputs.batch_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: |
          set -euo pipefail
          node tools/sprite_refinery_plan.mjs \
            --manifest "${{ inputs.manifest || 'vanguard-fleshpunk-001' }}" \
            --provider "${{ inputs.provider || 'fixture' }}" \
            --out generated/sprite-refinery/plan.json
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('generated/sprite-refinery/plan.json', 'utf8'));
          console.log(`matrix=${JSON.stringify({ include: plan.matrix })}`);
          console.log(`max_concurrency=${plan.max_concurrency}`);
          console.log(`batch_id=${plan.batch_id}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-refinery-plan
          path: generated/sprite-refinery/plan.json
          if-no-files-found: error

  clip-worker:
    needs: planner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.planner.outputs.max_concurrency) }}
      matrix: ${{ fromJSON(needs.planner.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Blender cache
        if: ${{ (inputs.provider || 'fixture') == 'openai' }}
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: .toolcache/blender-4.4.0
          key: blender-linux-x64-4.4.0-official-sha256-v2
      - name: Materialize Blender once
        if: ${{ (inputs.provider || 'fixture') == 'openai' && steps.blender-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p .toolcache/blender-4.4.0
          curl --fail --location --retry 3 "$BLENDER_URL" --output "$RUNNER_TEMP/$BLENDER_ARCHIVE"
          curl --fail --location --retry 3 "$BLENDER_CHECKSUM_URL" --output "$RUNNER_TEMP/blender-4.4.0.sha256"
          ( cd "$RUNNER_TEMP" && grep -E "[[:space:]]+$BLENDER_ARCHIVE$" blender-4.4.0.sha256 | sha256sum --check --strict - )
          tar --extract --file "$RUNNER_TEMP/$BLENDER_ARCHIVE" --directory .toolcache/blender-4.4.0 --strip-components 1
      - name: Save Blender cache
        if: ${{ (inputs.provider || 'fixture') == 'openai' && steps.blender-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .toolcache/blender-4.4.0
          key: blender-linux-x64-4.4.0-official-sha256-v2
      - name: Install render dependencies
        run: |
          python3 -c "from PIL import Image; print(Image.__version__)" || python3 -m pip install --user --disable-pip-version-check pillow==11.3.0
          if [ "${{ inputs.provider || 'fixture' }}" = "openai" ]; then sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri; fi
      - name: Render/edit/split/verify clip
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLENDER_BIN: .toolcache/blender-4.4.0/blender
          LIBGL_ALWAYS_SOFTWARE: "1"
          SPRITE_REFINERY_SKIP_RENDER: ${{ (inputs.provider || 'fixture') == 'fixture' && '1' || '0' }}
        continue-on-error: true
        run: |
          node tools/sprite_refinery_worker.mjs \
            --manifest "${{ matrix.manifest }}" \
            --clip "${{ matrix.clip_id }}" \
            --provider "${{ inputs.provider || 'fixture' }}" \
            --out-dir "generated/sprite-refinery/workers/${{ matrix.batch_id }}/${{ matrix.clip_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-refinery-worker-${{ matrix.clip_id }}
          path: generated/sprite-refinery/workers/${{ matrix.batch_id }}/${{ matrix.clip_id }}
          if-no-files-found: error
          retention-days: 30

  collector:
    needs: [planner, clip-worker]
    if: ${{ always() && needs.planner.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: sprite-refinery-worker-*
          path: generated/sprite-refinery/downloaded
      - name: Normalize downloaded worker artifacts
        run: |
          mkdir -p "generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}"
          find generated/sprite-refinery/downloaded -name result.json -print | while read -r result; do
            clip=$(node -e "const r=require('./'$result); console.log(r.clip_id || 'unknown')")
            mkdir -p "generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/$clip"
            cp -R "$(dirname "$result")"/. "generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/$clip/"
          done
      - name: Collect ready clips and build review surface
        run: |
          node tools/sprite_refinery_collect.mjs \
            --manifest "${{ inputs.manifest || 'vanguard-fleshpunk-001' }}" \
            --publish "${{ inputs.publish || false }}"
          npm run test:2d
          npm run build
          npm run smoke
          git diff --check
      - name: Commit collector output once
        if: ${{ (inputs.publish || 'false') == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vanguard/fleshpunk public/reviews/sprite-refinery
          if git diff --cached --quiet; then
            echo "No collector changes to commit."
          else
            git commit -m "Collect Sprite Refinery batch ${{ needs.planner.outputs.batch_id }}"
            git push
          fi
      - name: Open or update draft batch PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Sprite Refinery batch ${{ needs.planner.outputs.batch_id }}"
          body="Automated Sprite Refinery collector output for ${{ needs.planner.outputs.batch_id }}. Review URL path: /?view=2d&manifest=./reviews/sprite-refinery/${{ needs.planner.outputs.batch_id }}/animations.json . Do not merge until generated artwork is inspected."
          existing=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            gh pr ready "$existing" --undo || true
          else
            gh pr create --draft --base main --head "${GITHUB_REF_NAME}" --title "$title" --body "$body"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-refinery-batch-review-${{ needs.planner.outputs.batch_id }}
          path: |
            public/reviews/sprite-refinery/${{ needs.planner.outputs.batch_id }}/
            generated/sprite-refinery/workers/${{ needs.planner.outputs.batch_id }}/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-review:
    needs: collector
    if: ${{ always() && needs.collector.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
