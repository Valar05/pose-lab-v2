name: Sprite Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vanguard-native-contact-sheet
    paths:
      - .github/workflows/sprite-visual-qa.yml
      - index.html
      - package.json
      - scripts/build.mjs
      - scripts/smoke.mjs
      - src/sprite-viewer.js
      - src/styles.css
      - tools/capture_sprite_review.mjs
      - tools/test_sprite_review_surface.mjs
      - public/fixtures/vanguard-refinery/visual-qa/**
      - public/assets/vanguard/fleshpunk/**

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package without browser download
        run: npm install --no-save playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Verify and build 2D review
        run: |
          npm run test:2d
          npm run build
          npm run smoke
          git diff --check
      - name: Capture Idle, SwordAttack1, and refinery READY/RED evidence
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/sprite-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node -e '
            const http = require("http");
            let attempts = 0;
            const check = () => http.get("http://127.0.0.1:4173/", (response) => {
              response.resume();
              if (response.statusCode === 200) process.exit(0);
              if (++attempts > 50) process.exit(1);
              setTimeout(check, 100);
            }).on("error", () => {
              if (++attempts > 50) process.exit(1);
              setTimeout(check, 100);
            });
            check();
          '
          node tools/capture_sprite_review.mjs \
            --url http://127.0.0.1:4173/ \
            --out-dir generated/sprite-review \
            --batch-fixture /fixtures/vanguard-refinery/visual-qa/state.json
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-visual-evidence-${{ github.run_id }}
          path: generated/sprite-review/
          if-no-files-found: error
          retention-days: 30
