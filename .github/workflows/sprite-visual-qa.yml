name: Sprite Visual QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sprite-visual-qa.yml
      - package.json
      - tools/register_vanguard_attack1_frames.py
      - tools/test_vanguard_attack1_registration.py
      - tools/test_sprite_review_surface.mjs
      - tools/test_vanguard_muramasa_canary.mjs
      - src/sprite-viewer.js
      - src/styles.css
      - public/assets/vanguard/fleshpunk/**
  push:
    branches:
      - agent/vanguard-native-contact-sheet
    paths:
      - .github/workflows/sprite-visual-qa.yml
      - index.html
      - package.json
      - scripts/build.mjs
      - scripts/smoke.mjs
      - src/sprite-viewer.js
      - src/styles.css
      - tools/capture_sprite_review.mjs
      - tools/test_sprite_review_surface.mjs
      - tools/test_vanguard_attack1_registration.py
      - public/fixtures/vanguard-refinery/visual-qa/**
      - public/assets/vanguard/fleshpunk/**

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package without browser download
        run: npm install --no-save playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Install registration test dependency
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify and build 2D review
        run: |
          npm run test:vanguard-attack1-registration
          npm run test:2d
          npm run test:vanguard-muramasa-canary
          npm run build
          npm run smoke
          git diff --check
      - name: Capture Idle, SwordAttack1, and refinery READY/RED evidence
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/sprite-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node -e '
            const http = require("http");
            let attempts = 0;
            const check = () => http.get("http://127.0.0.1:4173/", (response) => {
              response.resume();
              if (response.statusCode === 200) process.exit(0);
              if (++attempts > 50) process.exit(1);
              setTimeout(check, 100);
            }).on("error", () => {
              if (++attempts > 50) process.exit(1);
              setTimeout(check, 100);
            });
            check();
          '
          node tools/capture_sprite_review.mjs \
            --url http://127.0.0.1:4173/ \
            --out-dir generated/sprite-review \
            --batch-fixture /fixtures/vanguard-refinery/visual-qa/state.json
          node tools/capture_sprite_review.mjs \
            --url http://127.0.0.1:4173/ \
            --out-dir generated/sprite-review/muramasa-canary-001 \
            --manifest /assets/vanguard/fleshpunk/candidates/muramasa-canary-001/animations.json \
            --animations oberhau-hardest-key-canary-001 \
            --skip-delta
      - name: Persist synchronized canary evidence
        if: github.event_name == "workflow_dispatch"
        run: |
          evidence_dir="public/assets/vanguard/fleshpunk/candidates/muramasa-canary-001/evidence/cloud-review"
          mkdir -p "$evidence_dir"
          cp generated/sprite-review/muramasa-canary-001/oberhau-hardest-key-canary-001-clean.png "$evidence_dir/synchronized-pose-lab-comparison.png"
          cp generated/sprite-review/muramasa-canary-001/report.json "$evidence_dir/report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$evidence_dir"
          if git diff --cached --quiet; then
            echo "Synchronized canary evidence already current."
          else
            git commit -m "Record synchronized Vanguard canary evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sprite-visual-evidence-${{ github.run_id }}
          path: generated/sprite-review/
          if-no-files-found: error
          retention-days: 30
