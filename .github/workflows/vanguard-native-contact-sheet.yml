name: Vanguard Native Pose Packet

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vanguard-native-contact-sheet
    paths:
      - tools/render_animation_pose_packet.py
      - tools/assemble_animation_pose_packet.py
      - tools/verify_animation_pose_packet.py
      - docs/ANIMATION_POSE_IS_GOD_PIPELINE.md
      - .github/workflows/vanguard-native-contact-sheet.yml

permissions:
  contents: read

env:
  BLENDER_VERSION: "4.4.0"
  BLENDER_ARCHIVE: "blender-4.4.0-linux-x64.tar.xz"
  BLENDER_SHA256: "d1c198b637da213339e51d4a3e01afd65f0afd187d38ca8fb07f4bbda0ca3693"
  BLENDER_URL: "https://download.blender.org/release/Blender4.4/blender-4.4.0-linux-x64.tar.xz"

jobs:
  pose-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent Blender toolchain
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .toolcache/blender-4.4.0
          key: blender-linux-x64-4.4.0-${{ env.BLENDER_SHA256 }}

      - name: Materialize Blender once
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolcache/blender-4.4.0
          curl --fail --location --retry 3 \
            "$BLENDER_URL" \
            --output "$RUNNER_TEMP/$BLENDER_ARCHIVE"
          echo "$BLENDER_SHA256  $RUNNER_TEMP/$BLENDER_ARCHIVE" | sha256sum --check -
          tar --extract \
            --file "$RUNNER_TEMP/$BLENDER_ARCHIVE" \
            --directory .toolcache/blender-4.4.0 \
            --strip-components 1

      - name: Restore Python package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pose-packet-pip-pillow-11.3.0

      - name: Install lightweight render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          python3 -m pip install --user --disable-pip-version-check pillow==11.3.0

      - name: Render native SwordAttack1 pose packet
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          .toolcache/blender-4.4.0/blender --background \
            --python-exit-code 1 \
            --python tools/render_animation_pose_packet.py \
            -- \
            --asset public/assets/vanguard/vanguard_rigged_animations.glb \
            --out-dir generated/vanguard-swordattack1-pose-packet \
            --action SwordAttack1 \
            --frames 0,3,6,9,12,15,18,21,24,28,33,38 \
            --source-fps 60 \
            --camera-side right

      - name: Assemble exact-grid references
        run: |
          python3 tools/assemble_animation_pose_packet.py \
            --root generated/vanguard-swordattack1-pose-packet

      - name: Verify native geometry contract
        run: |
          python3 tools/verify_animation_pose_packet.py \
            --root generated/vanguard-swordattack1-pose-packet \
            --report generated/vanguard-swordattack1-pose-packet/verification.json

      - name: Upload source-only pose packet
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-swordattack1-pose-packet
          path: generated/vanguard-swordattack1-pose-packet/
          if-no-files-found: error
          retention-days: 30
