name: Vanguard Native Pose Packet

on:
  workflow_dispatch:
    inputs:
      action:
        description: Embedded Vanguard action to render
        required: true
        default: SwordAttack1
        type: string
      frames:
        description: Comma-separated source frame indices
        required: true
        default: 0,3,6,9,12,15,18,21,24,28,33,38
        type: string
      columns:
        description: Pose-packet grid columns
        required: true
        default: "4"
        type: string
      rows:
        description: Pose-packet grid rows
        required: true
        default: "3"
        type: string
      output_slug:
        description: Filesystem-safe output name
        required: true
        default: swordattack1
        type: string
  push:
    branches:
      - agent/vanguard-native-contact-sheet
    paths:
      - tools/render_animation_pose_packet.py
      - tools/assemble_animation_pose_packet.py
      - tools/verify_animation_pose_packet.py
      - docs/ANIMATION_POSE_IS_GOD_PIPELINE.md
      - .github/workflows/vanguard-native-contact-sheet.yml

permissions:
  contents: read

env:
  BLENDER_VERSION: "4.4.0"
  BLENDER_ARCHIVE: "blender-4.4.0-linux-x64.tar.xz"
  BLENDER_URL: "https://download.blender.org/release/Blender4.4/blender-4.4.0-linux-x64.tar.xz"
  BLENDER_CHECKSUM_URL: "https://download.blender.org/release/Blender4.4/blender-4.4.0.sha256"

jobs:
  pose-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent Blender toolchain
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: .toolcache/blender-4.4.0
          key: blender-linux-x64-4.4.0-official-sha256-v2

      - name: Materialize Blender once
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolcache/blender-4.4.0
          curl --fail --location --retry 3 \
            "$BLENDER_URL" \
            --output "$RUNNER_TEMP/$BLENDER_ARCHIVE"
          curl --fail --location --retry 3 \
            "$BLENDER_CHECKSUM_URL" \
            --output "$RUNNER_TEMP/blender-4.4.0.sha256"
          (
            cd "$RUNNER_TEMP"
            grep -E "[[:space:]]+$BLENDER_ARCHIVE$" blender-4.4.0.sha256 \
              | sha256sum --check --strict -
          )
          tar --extract \
            --file "$RUNNER_TEMP/$BLENDER_ARCHIVE" \
            --directory .toolcache/blender-4.4.0 \
            --strip-components 1

      - name: Save persistent Blender toolchain
        if: steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .toolcache/blender-4.4.0
          key: blender-linux-x64-4.4.0-official-sha256-v2

      - name: Restore Python package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pose-packet-pip-pillow-11.3.0

      - name: Install lightweight render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          python3 -m pip install --user --disable-pip-version-check pillow==11.3.0

      - name: Render native Vanguard pose packet
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ACTION_NAME: ${{ inputs.action || 'SwordAttack1' }}
          SOURCE_FRAMES: ${{ inputs.frames || '0,3,6,9,12,15,18,21,24,28,33,38' }}
          GRID_COLUMNS: ${{ inputs.columns || '4' }}
          GRID_ROWS: ${{ inputs.rows || '3' }}
          OUTPUT_SLUG: ${{ inputs.output_slug || 'swordattack1' }}
        run: |
          .toolcache/blender-4.4.0/blender --background \
            --python-exit-code 1 \
            --python tools/render_animation_pose_packet.py \
            -- \
            --asset public/assets/vanguard/vanguard_rigged_animations.glb \
            --out-dir "generated/vanguard-$OUTPUT_SLUG-pose-packet" \
            --action "$ACTION_NAME" \
            --frames "$SOURCE_FRAMES" \
            --source-fps 60 \
            --camera-side right \
            --columns "$GRID_COLUMNS" \
            --rows "$GRID_ROWS"

      - name: Assemble exact-grid references
        env:
          OUTPUT_SLUG: ${{ inputs.output_slug || 'swordattack1' }}
        run: |
          python3 tools/assemble_animation_pose_packet.py \
            --root "generated/vanguard-$OUTPUT_SLUG-pose-packet"

      - name: Verify native geometry contract
        env:
          OUTPUT_SLUG: ${{ inputs.output_slug || 'swordattack1' }}
        run: |
          python3 tools/verify_animation_pose_packet.py \
            --root "generated/vanguard-$OUTPUT_SLUG-pose-packet" \
            --report "generated/vanguard-$OUTPUT_SLUG-pose-packet/verification.json"

      - name: Emit compact source packet in job log
        env:
          OUTPUT_SLUG: ${{ inputs.output_slug || 'swordattack1' }}
        run: |
          python3 - <<'PY'
          import base64
          import io
          import json
          import os
          import zipfile
          from pathlib import Path
          from PIL import Image

          root = Path(f"generated/vanguard-{os.environ['OUTPUT_SLUG']}-pose-packet")
          manifest = json.loads((root / "manifest.json").read_text())
          frame_count = len(manifest["frames"])
          payload = io.BytesIO()
          with zipfile.ZipFile(payload, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in ("manifest.json", "appearance-only-generation-contract.json", "verification.json"):
                  archive.write(root / name, name)
              if frame_count <= 12:
                  for name in ("beauty-grid.png", "silhouette-grid.png", "limb-id-grid.png", "depth-grid.png", "geometry-grid.png"):
                      archive.write(root / name, name)
              else:
                  for name in ("beauty-grid.png", "limb-id-grid.png"):
                      with Image.open(root / name) as image:
                          preview = image.convert("RGB")
                          preview.thumbnail((1470, 1560), Image.Resampling.LANCZOS)
                          encoded = io.BytesIO()
                          preview.save(encoded, "JPEG", quality=88, optimize=True)
                          archive.writestr(name.replace(".png", "-preview.jpg"), encoded.getvalue())
          encoded = base64.b64encode(payload.getvalue()).decode("ascii")
          print(f"POSE_PACKET_LOG_BUNDLE_BEGIN {os.environ['OUTPUT_SLUG']} {frame_count} {len(payload.getvalue())}")
          for offset in range(0, len(encoded), 76):
              print(encoded[offset:offset + 76])
          print("POSE_PACKET_LOG_BUNDLE_END")
          PY

      - name: Upload source-only pose packet
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-${{ inputs.output_slug || 'swordattack1' }}-pose-packet
          path: generated/vanguard-${{ inputs.output_slug || 'swordattack1' }}-pose-packet/
          if-no-files-found: error
          retention-days: 30
