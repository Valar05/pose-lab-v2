name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run smoke
      - name: Purge old Pose Lab build artifacts before publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Artifacts are disposable. Git history, releases, and run logs remain.
          # Delete only within the current repository.
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')"
          deleted=0
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null
            ((deleted += 1))
          done <<< "$ids"
          echo "Purged ${deleted} stale Pose Lab artifacts."
      # Publish Connie's unapproved candidate as a SHA-locked *review only*.
      # This GitHub Pages deployment runs on main's existing authorized lane,
      # but does not merge or promote the feature branch into the live app.
      - name: Checkout Connie exact source and rendering implementation
        uses: actions/checkout@v4
        with:
          ref: 1f8b45bc8f2fd4def16a338bbb7fba7fe9e40359
          path: .connie-source
          persist-credentials: false
      - name: Checkout original Connie atlas implementation for prior review link
        uses: actions/checkout@v4
        with:
          ref: 81253e0f6bc1ab03bff59ea7b94698a03a80970a
          path: .connie-original-review
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve previously published original Connie review route
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 .connie-original-review/tools/campaigns/connie_v3_cloud_preview.py \
            --revision "56f000831aecdde15fc3588effd93aa822ebdb79" \
            --output dist/review/connie/56f000831aecdde15fc3588effd93aa822ebdb79
          test -f dist/review/connie/56f000831aecdde15fc3588effd93aa822ebdb79/index.html
      - name: Generate one quarantined Connie ten-pose sprite sheet and comparisons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          target="dist/review/connie/56f000831aecdde15fc3588effd93aa822ebdb79/compact-v2"
          python3 .connie-source/tools/campaigns/connie_v3_cloud_preview.py \
            --revision "56f000831aecdde15fc3588effd93aa822ebdb79" \
            --output "$target"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          sha="56f000831aecdde15fc3588effd93aa822ebdb79"
          candidate=Path(".connie-source")
          target=Path("dist/review/connie")/sha/"compact-v2"
          report=json.loads((target/"report.json").read_text())
          assert report["sourceRevision"]==sha
          assert report["status"]=="quarantined-awaiting-human-review"
          assert report["pinwheelBlocked"] and not report["gameReady"]
          assert len(report["groups"])==4
          sources=json.loads((candidate/"campaigns/connie-source-measurements-v3.json").read_text())["sources"]
          for role,info in sources.items():
              src=candidate/info["repoPath"]
              assert src.is_file() and hashlib.sha256(src.read_bytes()).hexdigest()==info["sha256"]
              assert report["originalSHA256"][role]==info["sha256"]
          for group in report["groups"]:
              path=target/group["originalContactSheet"]
              assert path.exists()
              with Image.open(path) as im: im.verify()
              if group["status"].startswith("BLOCKED"):
                  assert "candidateContactSheet" not in group
              else:
                  path=target/group["candidateContactSheet"]
                  assert path.exists()
                  with Image.open(path) as im: im.verify()
          atlas=json.loads((target/"connie-unified-sprite-sheet.json").read_text())
          picture=target/"connie-unified-sprite-sheet.png"
          assert atlas["frameCount"]==10 and len(atlas["frames"])==10
          assert atlas["canvasPx"]==[3712,2952] # Exact real-source candidate geometry
          assert atlas["status"].startswith("quarantined")
          assert atlas["sourceCommit"]==sha
          assert atlas["layout"]["kind"]=="irregular-row-packed"
          assert atlas["layout"]["rowCount"]==3
          assert atlas["canvasAreaReduction"]>=0.25
          assert atlas["uniformSequenceFactors"]["dash"]==1.0
          assert not atlas["gameReady"] and atlas["timeStatus"].startswith("No authored")
          assert hashlib.sha256(picture.read_bytes()).hexdigest()==atlas["sha256"]
          with Image.open(picture) as im:
              assert im.mode=="RGBA" and list(im.size)==atlas["canvasPx"]
              im.verify()
          assert "connie-unified-sprite-sheet.png" in (target/"index.html").read_text()
          assert (target/"index.html").is_file()
          print("PAGES_CONNIE_QUARANTINED_SHA_REVIEW_OK", sha)
          PY
      - name: Checkout actual anatomical calibration revision
        uses: actions/checkout@v4
        with:
          ref: 03f1173f2a7a50acaf53bcecca2ae42ee18a3b87
          path: .connie-anatomical-v3
          persist-credentials: false
      - name: Generate anatomically scale-normalized Connie sheet and head comparison
        shell: bash
        run: |
          set -euo pipefail
          target="dist/review/connie/56f000831aecdde15fc3588effd93aa822ebdb79/anatomical-v3"
          python3 .connie-anatomical-v3/tools/campaigns/connie_v3_cloud_preview.py \
            --revision "56f000831aecdde15fc3588effd93aa822ebdb79" \
            --output "$target"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path("dist/review/connie/56f000831aecdde15fc3588effd93aa822ebdb79/anatomical-v3")
          source=Path(".connie-anatomical-v3")
          report=json.loads((root/"report.json").read_text())
          atlas=json.loads((root/"connie-unified-sprite-sheet.json").read_text())
          calib=json.loads((source/"campaigns/connie-anatomical-v3-calibration-v1.json").read_text())
          assert report["status"]=="quarantined-awaiting-human-review"
          assert not report["gameReady"] and atlas["gameReady"] is False
          assert atlas["frameCount"]==10 and len(atlas["frames"])==10
          assert atlas["canvasPx"]==[3258,2923]
          assert len(report["groups"])==4
          factors=atlas["uniformSequenceFactors"]
          assert abs(factors["run"]-1.29218916)<.000001
          assert abs(factors["rebound"]-.99947171)<.000001
          assert abs(factors["dash"]-1.08848718)<.000001
          assert calib["canonical"]=="idle"
          assert calib["policy"]["maximumRelativeAnatomicalResidual"]==.08
          assert all(g["maximumAnatomicalResidual"]<=.08 for g in report["groups"])
          assert "connie-anatomical-head-audit.png" in (root/"index.html").read_text()
          with Image.open(root/"connie-anatomical-head-audit.png") as proof:
              assert proof.size==(1700,710)
              proof.verify()
          image=root/"connie-unified-sprite-sheet.png"
          with Image.open(image) as im:
              assert im.mode=="RGBA" and list(im.size)==atlas["canvasPx"]
              im.verify()
          assert hashlib.sha256(image.read_bytes()).hexdigest()==atlas["sha256"]
          original=json.loads((source/"campaigns/connie-source-measurements-v3.json").read_text())
          for role,info in original["sources"].items():
              src=source/info["repoPath"]
              assert hashlib.sha256(src.read_bytes()).hexdigest()==info["sha256"]
          print("GITHUB_PAGES_CONNIE_ANATOMICAL_SCALE_MATCH_OK=4")
          print("GITHUB_PAGES_CONNIE_ALL_TEN_NORMALIZED_OK=10")
          print("GITHUB_PAGES_CONNIE_NOVEL_HEADLESS_FRAME_UNINVENTED=TRUE")
          PY
      - name: Checkout RUN-canonical Connie correction
        uses: actions/checkout@v4
        with:
          ref: 87dfb84135c996bce7354958d69306cfaa502d09
          path: .connie-run-canonical
          persist-credentials: false
      - name: Build one corrected Connie sheet using unchanged 1x run
        shell: bash
        run: |
          set -euo pipefail
          target="dist/review/connie/56f000831aecdde15fc3588effd93aa822ebdb79/run-canonical-v4"
          python3 .connie-run-canonical/tools/campaigns/connie_v3_cloud_preview.py \
            --revision "56f000831aecdde15fc3588effd93aa822ebdb79" \
            --output "$target"
          python3 - <<'PY'
          import hashlib,json,math,statistics
          from pathlib import Path
          from PIL import Image
          base=Path("dist/review/connie/56f000831aecdde15fc3588effd93aa822ebdb79/run-canonical-v4")
          source=Path(".connie-run-canonical")
          report=json.loads((base/"report.json").read_text())
          atlas=json.loads((base/"connie-unified-sprite-sheet.json").read_text())
          cfg=json.loads((source/"campaigns/connie-anatomical-v3-calibration-v1.json").read_text())
          assert cfg["canonical"]=="run" and cfg["canonicalFrameAuthority"]==["run_1","run_2","run_3"]
          assert cfg["metric"]=="shoulder-to-hip-body-core-physical-distance"
          assert report["status"]=="quarantined-awaiting-human-review"
          assert report["singleSpriteSheetFrameCount"]==10
          assert atlas["frameCount"]==len(atlas["frames"])==10
          assert atlas["sourceCommit"]=="56f000831aecdde15fc3588effd93aa822ebdb79"
          assert atlas["canvasPx"]==[2234,1822] # GitHub real-source output, not synthetic fixture
          factors=atlas["uniformSequenceFactors"]
          assert factors["run"]==1.0
          assert abs(factors["idle"]-.45299127)<.000001
          assert abs(factors["rebound"]-.77094361)<.000001
          assert abs(factors["dash"]-.77400413)<.000001
          assert factors["idle"]<factors["run"]
          assert all(group["canonicalCharacterScale"]=="run" for group in report["groups"])
          assert all(group["maximumAnatomicalResidual"]<=.08 for group in report["groups"])
          assert next(g for g in report["groups"] if g["id"]=="idle")["headProportionMismatchFlag"] is True
          image=base/"connie-unified-sprite-sheet.png"
          assert hashlib.sha256(image.read_bytes()).hexdigest()==atlas["sha256"]
          with Image.open(image) as im:
              assert im.mode=="RGBA" and list(im.size)==atlas["canvasPx"]
              im.verify()
          proof=base/"connie-run-body-scale-audit.png"
          with Image.open(proof) as im:
              assert im.size==(1750,760)
              im.verify()
          assert "connie-run-body-scale-audit.png" in (base/"index.html").read_text()
          src=json.loads((source/"campaigns/connie-source-measurements-v3.json").read_text())
          for role,item in src["sources"].items():
              assert hashlib.sha256((source/item["repoPath"]).read_bytes()).hexdigest()==item["sha256"]
          print("CONNIE_PAGES_RUN_FIXED_AT_1X=TRUE")
          print("CONNIE_PAGES_IDLE_ACTUALLY_SHRUNK_TO_0_453=TRUE")
          print("CONNIE_PAGES_ALL_TEN_RUN_REFERENCED=TRUE")
          print("CONNIE_HEAD_BODY_MISMATCH_EXPLICITLY_REPORTED=TRUE")
          PY
      # Quarantined native Motion Profile Lab preview. Does not merge Connie into main.
      - name: Checkout Connie native motion campaign
        uses: actions/checkout@v4
        with:
          ref: 749b05bfc769b4eb072fca37cf8c12241add583f
          path: .connie-motion-campaign
          persist-credentials: false
      - name: Publish Connie native motion review
        shell: bash
        run: |
          set -euo pipefail
          target="dist/review/connie-motion"
          mkdir -p "$target/assets"
          cp .connie-motion-campaign/motion.html "$target/motion.html"
          cp -R .connie-motion-campaign/src "$target/src"
          cp -R .connie-motion-campaign/vendor "$target/vendor"
          cp -R .connie-motion-campaign/public/assets/connie "$target/assets/connie"
          test -f "$target/src/motion/connie-profiles.js"
          test -f "$target/assets/connie/connie-approved-composite.png"
          grep -q 'motion-profile-editor' "$target/motion.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4




